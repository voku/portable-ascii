name: Apply Issue 62 Fix

on:
  push:
    branches:
      - agent/issue-62-real-replay
    paths:
      - '.github/workflows/apply-issue-62-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add decomposed German umlaut mappings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/voku/helper/data/ascii_by_languages.php')
          content = path.read_text(encoding='utf-8')
          before = """    // German
              'de' => [
                  'Ä' => 'Ae',
                  'Ö' => 'Oe',
                  'Ü' => 'Ue',
                  'ä' => 'ae',
                  'ö' => 'oe',
                  'ü' => 'ue',
                  'ß' => 'ss',
                  'ẞ' => 'SS',
              ],
          """
          after = """    // German
              'de' => [
                  'Ä' => 'Ae',
                  'Ö' => 'Oe',
                  'Ü' => 'Ue',
                  'A\u0308' => 'Ae',
                  'O\u0308' => 'Oe',
                  'U\u0308' => 'Ue',
                  'ä' => 'ae',
                  'ö' => 'oe',
                  'ü' => 'ue',
                  'a\u0308' => 'ae',
                  'o\u0308' => 'oe',
                  'u\u0308' => 'ue',
                  'ß' => 'ss',
                  'ẞ' => 'SS',
              ],
          """
          if content.count(before) != 1:
              raise SystemExit('Expected exactly one unchanged German replacement block')
          path.write_text(content.replace(before, after), encoding='utf-8')
          PY

          git rm .github/workflows/apply-issue-62-fix.yml
          git diff --check
          git diff -- src/voku/helper/data/ascii_by_languages.php tests/AsciiDecomposedUmlautTest.php

      - name: Commit bounded production fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/voku/helper/data/ascii_by_languages.php .github/workflows/apply-issue-62-fix.yml
          git commit -m 'fix: map decomposed German umlauts'
          git push origin HEAD:agent/issue-62-real-replay
