name: Agent Loop Issue 62 Real Replay

on:
  workflow_dispatch:
  push:
    branches:
      - agent/issue-62-real-replay
    paths:
      - '.github/workflows/agent-loop-issue-62-dogfood.yml'
      - 'tools/agent-loop/**'

permissions:
  contents: read

jobs:
  frozen-prefx-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout replay harness
        uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false

      - name: Checkout frozen portable-ascii target
        uses: actions/checkout@v7
        with:
          repository: voku/portable-ascii
          ref: c5aede519cc55833267bcbb421b222d7aacfaa06
          path: target
          persist-credentials: false

      - name: Setup PHP 8.3 and Composer
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip, json, mbstring, pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Install frozen target and released tool control
        run: |
          set -euo pipefail
          composer update --working-dir=target --prefer-dist --no-interaction --no-progress
          composer install --working-dir=harness/tools/agent-loop --prefer-dist --no-interaction --no-progress

      - name: Verify frozen provenance
        run: |
          set -euo pipefail
          issue='harness/tools/agent-loop/dogfood/issue-62.json'
          test "$(jq -r '.target_base_commit' "${issue}")" = "$(git -C target rev-parse HEAD)"
          test "$(jq -r '.toolchain.agent_loop_version' "${issue}")" = "$(composer show --working-dir=harness/tools/agent-loop voku/agent-loop --format=json | jq -r '.versions[0]')"
          test "$(composer show --working-dir=harness/tools/agent-loop voku/agent-map --format=json | jq -r '.versions[0]')" = '0.7.0'
          test "$(composer show --working-dir=harness/tools/agent-loop voku/agent-recall-compiler --format=json | jq -r '.versions[0]')" = '0.11.0'

      - name: Prove issue is still reproducible before discovery
        run: |
          set -euo pipefail
          mkdir -p target/.agent-loop/dogfood/issue-62
          php -r '
          require "target/vendor/autoload.php";
          $composed = "\u{00E4}";
          $decomposed = "a\u{0308}";
          $result = [
              "composed_codepoints" => ["U+00E4"],
              "decomposed_codepoints" => ["U+0061", "U+0308"],
              "composed_de" => \voku\helper\ASCII::to_ascii($composed, "de"),
              "decomposed_de" => \voku\helper\ASCII::to_ascii($decomposed, "de"),
              "expected" => "ae",
          ];
          file_put_contents(
              "target/.agent-loop/dogfood/issue-62/reproduction.json",
              json_encode($result, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          if ($result["composed_de"] !== "ae") {
              fwrite(STDERR, "Baseline drift: composed German umlaut no longer maps to ae.\n");
              exit(2);
          }
          if ($result["decomposed_de"] === "ae") {
              fwrite(STDERR, "STOP: issue #62 is no longer reproducible on the frozen base.\n");
              exit(3);
          }
          if ($result["decomposed_de"] !== "a") {
              fwrite(STDERR, "Baseline drift: issue #62 now fails differently; do not rewrite the oracle.\n");
              exit(4);
          }
          '
          cat target/.agent-loop/dogfood/issue-62/reproduction.json

      - name: Establish project-native baseline gates
        working-directory: target
        run: |
          set -euo pipefail
          composer validate --strict
          php vendor/bin/phpunit -c phpunit.xml

      - name: Capture raw agent-map evidence from exact issue text
        working-directory: target
        run: |
          set -euo pipefail
          tool='../harness/tools/agent-loop/vendor/bin'
          issue='../harness/tools/agent-loop/dogfood/issue-62.json'
          out='.agent-loop/dogfood/issue-62'
          query="$(jq -r '.issue | .title + "\n\n" + .body' "${issue}")"
          printf '%s\n' "${query}" > "${out}/query.txt"

          "${tool}/agent-map" build \
            --root=. \
            --paths=src,tests \
            --out=.agent-loop/map/php-symbols.json
          "${tool}/agent-map" search-index build \
            --root=. \
            --index=.agent-loop/map/php-symbols.json \
            --database=.agent-loop/map/search.sqlite
          "${tool}/agent-map" search "${query}" \
            --root=. \
            --index=.agent-loop/map/php-symbols.json \
            --database=.agent-loop/map/search.sqlite \
            --limit=15 \
            --format=json > "${out}/map-search.json"

          jq -e '.results | type == "array"' "${out}/map-search.json" >/dev/null

      - name: Capture Recall evidence without seeding a fix file
        working-directory: target
        run: |
          set -euo pipefail
          tool='../harness/tools/agent-loop/vendor/bin'
          issue='../harness/tools/agent-loop/dogfood/issue-62.json'
          out='.agent-loop/dogfood/issue-62'
          learning="${out}/learning"
          recall="${out}/recall"
          query="$(jq -r '.issue | .title + "\n\n" + .body' "${issue}")"
          mkdir -p "${learning}" "${recall}"

          "${tool}/agent-recall-compiler" compile \
            --root "${learning}" \
            --task 'GH-62' \
            --description "${query}" \
            --map-index '.agent-loop/map/php-symbols.json' \
            --map-root "$PWD" \
            --map-search-index '.agent-loop/map/search.sqlite' \
            --map-search-limit 10 \
            --output-dir "${recall}"

          test -f "${recall}/system.md"
          test -f "${recall}/meta.json"
          test -f "${recall}/facts.json"
          test -f "${recall}/selection-report.json"

      - name: Archive exact control provenance
        if: always()
        run: |
          set -euo pipefail
          out='target/.agent-loop/dogfood/issue-62'
          mkdir -p "${out}"
          git -C target rev-parse HEAD > "${out}/target-commit.txt"
          cp harness/tools/agent-loop/composer.lock "${out}/tool-composer.lock" 2>/dev/null || true
          composer show --working-dir=harness/tools/agent-loop --format=json > "${out}/tool-packages.json" 2>/dev/null || true
          php -v > "${out}/php-version.txt"
          composer --version > "${out}/composer-version.txt"

      - name: Upload frozen pre-fix evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-ascii-issue-62-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            harness/tools/agent-loop/dogfood/issue-62.json
            target/.agent-loop/dogfood/issue-62
            target/.agent-loop/map/php-symbols.json
